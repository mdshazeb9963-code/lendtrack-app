<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Track money you've lent to friends and family. See who owes you, when they'll repay, and send reminders.">
    <title>LendTrack — Money Lending Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="1" x2="12" y2="23"></line>
                        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                    </svg>
                </div>
                <h1>LendTrack</h1>
            </div>
            <div class="header-actions">
                <button id="remindAllBtn" class="btn-remind-all" aria-label="Send WhatsApp message to all pending borrowers at once">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span>Message All</span>
                </button>
                <button id="addBtn" class="btn-primary" aria-label="Add new lending record">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>Add Record</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Stats Dashboard -->
        <section class="stats-grid" aria-label="Lending Statistics">
            <div class="stat-card stat-card--lent">
                <div class="stat-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                        <polyline points="17 6 23 6 23 12"></polyline>
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Total Lent</span>
                    <span class="stat-value" id="totalLent">₹0</span>
                </div>
            </div>
            <div class="stat-card stat-card--recovered">
                <div class="stat-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Recovered</span>
                    <span class="stat-value" id="totalRecovered">₹0</span>
                </div>
            </div>
            <div class="stat-card stat-card--pending">
                <div class="stat-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Pending</span>
                    <span class="stat-value" id="totalPending">₹0</span>
                </div>
            </div>
            <div class="stat-card stat-card--overdue">
                <div class="stat-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Overdue</span>
                    <span class="stat-value" id="overdueCount">0</span>
                </div>
            </div>
        </section>

        <!-- Search & Filter -->
        <section class="controls-bar">
            <div class="search-wrapper">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="Search by name..." autocomplete="off">
            </div>
            <div class="filter-btns" id="filterBtns">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="pending">Pending</button>
                <button class="filter-btn" data-filter="overdue">Overdue</button>
                <button class="filter-btn" data-filter="paid">Paid</button>
            </div>
        </section>

        <!-- Borrowers List -->
        <section id="borrowersList" class="borrowers-list" aria-label="Borrowers list">
        </section>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-state-icon">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                    <path d="M22 10H2"></path>
                    <path d="M6 14h4"></path>
                </svg>
            </div>
            <h3>No Records Yet</h3>
            <p>Start tracking your lending by adding your first record.</p>
            <button class="btn-primary btn-empty" id="addBtnEmpty">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>Add First Record</span>
            </button>
        </div>
    </main>

    <!-- Add/Edit Modal -->
    <div id="modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Record</h2>
                <button id="closeModal" class="btn-close" aria-label="Close modal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <form id="lendingForm" novalidate>
                <input type="hidden" id="recordId">
                <div class="form-row">
                    <div class="form-group">
                        <label for="personName">Full Name <span class="required">*</span></label>
                        <input type="text" id="personName" placeholder="e.g. Rahul Sharma" required>
                    </div>
                    <div class="form-group">
                        <label for="personPhone">Phone Number <span class="required">*</span></label>
                        <input type="tel" id="personPhone" placeholder="e.g. 919876543210" required>
                        <small class="form-hint">Include country code (e.g. 91 for India)</small>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="lendAmount">Amount (₹) <span class="required">*</span></label>
                        <input type="number" id="lendAmount" placeholder="e.g. 5000" min="1" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="dateLent">Date Given <span class="required">*</span></label>
                        <input type="date" id="dateLent" required>
                    </div>
                    <div class="form-group">
                        <label for="repayDate">Expected Repayment Date <span class="required">*</span></label>
                        <input type="date" id="repayDate" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Person's Photo <span class="optional">(optional)</span></label>
                    <div class="photo-upload-container">
                        <input type="file" id="personPhoto" accept="image/*" capture="environment" style="display: none;">
                        <input type="hidden" id="photoData">
                        <div id="photoPreview" class="photo-preview">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                                <circle cx="12" cy="13" r="4"></circle>
                            </svg>
                            <span>Tap to take/choose photo</span>
                        </div>
                        <button type="button" id="removePhotoBtn" class="btn-remove-photo" style="display: none;">Remove</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="notes">Notes <span class="optional">(optional)</span></label>
                    <textarea id="notes" rows="3" placeholder="Any additional details..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn-primary btn-submit">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        <span>Save Record</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal-overlay confirm-modal" role="dialog" aria-modal="true">
        <div class="confirm-content">
            <div class="confirm-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
            </div>
            <p id="confirmMessage">Are you sure you want to delete this record?</p>
            <div class="confirm-actions">
                <button id="confirmNo" class="btn-secondary">Cancel</button>
                <button id="confirmYes" class="btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <script src="app.js"></script>
</body>
</html>
